.divider{height:1px;background:var(--bd);margin:16px 0}

// ---- Chart helpers ----
function drawChart(canvasId, datasets, opts) {
  const cvs = document.getElementById(canvasId);
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cvs.clientWidth, H = cvs.clientHeight;
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.scale(dpr, dpr);

  const pad = {t:30,r:20,b:40,l:52};
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;

  const allDates = [...new Set(datasets.flatMap(d=>d.points.map(p=>p.x)))].sort();
  const allVals = datasets.flatMap(d=>d.points.map(p=>p.y));
  const yMin = Math.floor(Math.min(...allVals)*0.85*100)/100;
  const yMax = Math.ceil(Math.max(...allVals)*1.1*100)/100;
  const yRange = yMax - yMin || 1;

  const xOf = i => pad.l + (allDates.length>1 ? i/(allDates.length-1)*cw : cw/2);
  const yOf = v => pad.t + ch - ((v-yMin)/yRange)*ch;

  // grid
  ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 0.5;
  const yTicks = 5;
  for (let i=0;i<=yTicks;i++) {
    const v = yMin + yRange*i/yTicks;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#8b90a0'; ctx.font='11px -apple-system,sans-serif'; ctx.textAlign='right';
    ctx.fillText('€'+v.toFixed(2), pad.l-6, y+4);
  }

  // x labels
  ctx.textAlign='center'; ctx.fillStyle='#8b90a0'; ctx.font='10px -apple-system,sans-serif';
  allDates.forEach((d,i) => {
    const x = xOf(i);
    const label = d.slice(5);
    ctx.fillText(label, x, H-pad.b+16);
  });

  // lines + dots
  datasets.forEach(ds => {
    const sorted = ds.points.sort((a,b)=>a.x.localeCompare(b.x));
    ctx.strokeStyle = ds.color; ctx.lineWidth = 2.5; ctx.lineJoin='round';
    ctx.beginPath();
    sorted.forEach((p,i) => {
      const x = xOf(allDates.indexOf(p.x)), y = yOf(p.y);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();

    // dots
    sorted.forEach(p => {
      const x = xOf(allDates.indexOf(p.x)), y = yOf(p.y);
      ctx.fillStyle = ds.color;
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e1e4eb'; ctx.font='bold 10px -apple-system,sans-serif'; ctx.textAlign='center';
      ctx.fillText('€'+p.y.toFixed(2), x, y-10);
    });
  });

  // title
  ctx.fillStyle='#e1e4eb'; ctx.font='bold 13px -apple-system,sans-serif'; ctx.textAlign='left';
  ctx.fillText(opts.title, pad.l, 18);

  // legend
  const lx = W - pad.r - 10;
  ctx.textAlign='right'; ctx.font='11px -apple-system,sans-serif';
  datasets.forEach((ds,i) => {
    const ly = 14 + i*16;
    ctx.fillStyle = ds.color;
    ctx.fillRect(lx-40, ly-5, 12, 3);
    ctx.fillStyle='#e1e4eb';
    ctx.fillText(ds.label, lx, ly);
  });
}

function buildSummaryData() {
  const std = WA_ORDERS.filter(o => !o.addon);
  const byDate = {};
  std.forEach(o => {
    if (!byDate[o.date]) byDate[o.date] = {bolt:[],wolt:[]};
    byDate[o.date][o.platform.toLowerCase()].push(o);
  });

  const cpoB = [], cpoW = [], ekmB = [], ekmW = [];
  Object.keys(byDate).sort().forEach(d => {
    const b = byDate[d].bolt, w = byDate[d].wolt;
    if (b.length) {
      cpoB.push({x:d, y: b.reduce((s,o)=>s+o.earnings,0)/b.length});
      ekmB.push({x:d, y: b.reduce((s,o)=>s+o.ePerKm,0)/b.length});
    }
    if (w.length) {
      cpoW.push({x:d, y: w.reduce((s,o)=>s+o.earnings,0)/w.length});
      ekmW.push({x:d, y: w.reduce((s,o)=>s+o.ePerKm,0)/w.length});
    }
  });

  // extend Wolt line with WA_RATES data (only entries with numeric €/km)
  WA_RATES.forEach(r => {
    const v = parseFloat(r.ePerKm.replace('€',''));
    if (!isNaN(v) && v > 0 && v < 10) {
      const existing = ekmW.find(p=>p.x===r.date);
      if (!existing) ekmW.push({x:r.date, y:v});
    }
  });

  return {cpoB, cpoW, ekmB, ekmW};
}

// ---- Render ----
let activeTab = 'summary';
let tarThreshold = 60;

function init() {
  const tabNames = [{key:'summary',label:'Summary'}];
  FLEETS.forEach(f => tabNames.push({key:f.key,label:f.name}));
  tabNames.push({key:'whatsapp',label:'WhatsApp Intel'});
  tabNames.push({key:'upload',label:'+ Add Fleet'});

  document.getElementById('mainTabs').innerHTML = tabNames.map(t =>
    `<div class="tab ${t.key===activeTab?'on':''}" onclick="switchTab('${t.key}')">${t.label}</div>`
  ).join('');

  rebuild();
}

function renderCompare() { return ''; }

function switchTab(key) {
  activeTab = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.textContent.trim() === getTabLabel(key)));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-'+key));
  if (key === 'summary') requestAnimationFrame(drawSummaryCharts);
}

function getTabLabel(key) {
  if (key === 'whatsapp') return 'WhatsApp Intel';
  if (key === 'upload') return '+ Add Fleet';
  const f = FLEETS.find(x => x.key === key);
  return f ? f.name : key;
}

function agg(couriers) {
  const act = couriers.filter(c => c.a);
  const del = act.reduce((s,c) => s+(c.del||0), 0);
  const oh = act.reduce((s,c) => s+(c.oh||0), 0);
  const ot = act.reduce((s,c) => s+(c.ot||0), 0);
  const earned = act.reduce((s,c) => s+(c.e||0), 0);
  const tips = act.reduce((s,c) => s+(c.tip||0), 0);
  const ht = act.filter(c => c.tar!=null && c.tar>=tarThreshold);
  const htDel = ht.reduce((s,c) => s+(c.del||0), 0);
  const htOh = ht.reduce((s,c) => s+(c.oh||0), 0);
  const htOt = ht.reduce((s,c) => s+(c.ot||0), 0);
  const htE = ht.reduce((s,c) => s+(c.e||0), 0);
  return {
    total: couriers.length, active: act.length, inactive: couriers.length - act.length,
    offline: couriers.filter(c=>c.off).length,
    del, oh:Math.round(oh*10)/10, ot:Math.round(ot*10)/10, earned:Math.round(earned),
    tips: Math.round(tips),
    ut: oh>0 ? Math.round(ot/oh*1000)/10 : 0,
    dph: oh>0 ? Math.round(del/oh*100)/100 : 0,
    eph: oh>0 ? Math.round(earned/oh*100)/100 : 0,
    cpo: del>0 ? Math.round(earned/del*100)/100 : 0,
    htCount: ht.length, htDel, htOh: Math.round(htOh*10)/10,
    htUt: htOh>0 ? Math.round(htOt/htOh*1000)/10 : 0,
    htDph: htOh>0 ? Math.round(htDel/htOh*100)/100 : 0,
    htEph: htOh>0 ? Math.round(htE/htOh*100)/100 : 0,
    htCpo: htDel>0 ? Math.round(htE/htDel*100)/100 : 0,
  };
}

function onTarChange(val) {
  tarThreshold = parseInt(val);
  rebuild();
}

function rebuild() {
  let html = '';
  html += renderSummary();
  html += renderCompare();
  FLEETS.forEach(f => { html += renderFleet(f); });
  html += renderWhatsApp();
  html += renderUpload();
  document.getElementById('panes').innerHTML = html;
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-'+activeTab));
  document.querySelectorAll('.tar-slider').forEach(el => el.value = tarThreshold);
  document.querySelectorAll('.tar-val').forEach(el => el.textContent = tarThreshold + '%');
  requestAnimationFrame(drawSummaryCharts);
}


function renderFleet(fleet) {
  const a = agg(fleet.couriers);
  const act = fleet.couriers.filter(c=>c.a);
  const utC = a.ut < 55 ? 'yl' : 'gn';

  // TAR buckets
  const tarB = [{l:'<50%',mn:0,mx:50,c:0},{l:'50-59%',mn:50,mx:60,c:0},{l:'60-69%',mn:60,mx:70,c:0},
                {l:'70-79%',mn:70,mx:80,c:0},{l:'80-89%',mn:80,mx:90,c:0},{l:'90%+',mn:90,mx:101,c:0}];
  const utB = [{l:'<30%',mn:0,mx:30,c:0},{l:'30-39%',mn:30,mx:40,c:0},{l:'40-49%',mn:40,mx:50,c:0},
               {l:'50-59%',mn:50,mx:60,c:0},{l:'60-69%',mn:60,mx:70,c:0},{l:'70%+',mn:70,mx:200,c:0}];
  act.forEach(c => {
    if(c.tar!=null) { const b=tarB.find(x=>c.tar>=x.mn&&c.tar<x.mx); if(b) b.c++; }
    if(c.ut!=null) { const b=utB.find(x=>c.ut>=x.mn&&c.ut<x.mx); if(b) b.c++; }
  });
  const maxT = Math.max(...tarB.map(b=>b.c),1);
  const maxU = Math.max(...utB.map(b=>b.c),1);

  // Vehicle mix
  const veh = {};
  act.forEach(c => { const v=c.v||'Unknown'; if(!veh[v])veh[v]={c:0,d:0,oh:0,e:0}; veh[v].c++; veh[v].d+=(c.del||0); veh[v].oh+=(c.oh||0); veh[v].e+=(c.e||0); });

  let h = `<div class="pane" id="pane-${fleet.key}">`;

  // Summary
  h += `<div class="sect"><h2>${fleet.name} — Fleet Summary</h2>`;
  h += `<div class="subt">${a.total} on roster · ${a.active} active · ${a.inactive} inactive · ${a.offline} set offline</div>`;
  h += `<div class="sg">
    <div class="sc"><div class="lb">Deliveries</div><div class="vl">${a.del.toLocaleString()}</div></div>
    <div class="sc"><div class="lb">Online Hours</div><div class="vl">${Math.round(a.oh).toLocaleString()}h</div></div>
    <div class="sc ${utC}"><div class="lb">UT%</div><div class="vl">${a.ut}%</div></div>
    <div class="sc"><div class="lb">DPH</div><div class="vl">${a.dph}</div></div>
    <div class="sc"><div class="lb">Earned</div><div class="vl">€${a.earned.toLocaleString()}</div></div>
    <div class="sc"><div class="lb">EPH</div><div class="vl">€${a.eph}</div></div>
    <div class="sc"><div class="lb">CPO</div><div class="vl">€${a.cpo}</div></div>
    <div class="sc"><div class="lb">Tips</div><div class="vl">€${a.tips.toLocaleString()}</div></div>
  </div></div>`;

  // Quality segment
  h += `<div class="sect"><h2>Quality Segment (TAR ≥ <span class="tar-val">${tarThreshold}%</span>)</h2>`;
  h += `<div class="subt">${a.htCount} couriers · ${a.htDel.toLocaleString()} deliveries (${a.del>0?Math.round(a.htDel/a.del*100):0}% of fleet)</div>`;
  h += `<div class="sg">
    <div class="sc gn"><div class="lb">UT%</div><div class="vl">${a.htUt}%</div></div>
    <div class="sc gn"><div class="lb">DPH</div><div class="vl">${a.htDph}</div></div>
    <div class="sc gn"><div class="lb">EPH</div><div class="vl">€${a.htEph}</div></div>
    <div class="sc gn"><div class="lb">CPO</div><div class="vl">€${a.htCpo}</div></div>
  </div></div>`;

  // Distributions
  h += `<div class="sect"><h2>Distributions</h2><div class="dg"><div>`;
  h += `<h3>TAR (Task Acceptance Rate)</h3>`;
  tarB.forEach(b => {
    const w = Math.max(b.c/maxT*100, b.c>0?8:0);
    h += `<div class="br"><span class="bl">${b.l}</span><div class="bt"><div class="bf a" style="width:${w}%">${b.c}</div></div></div>`;
  });
  h += `</div><div><h3>Utilisation %</h3>`;
  utB.forEach(b => {
    const w = Math.max(b.c/maxU*100, b.c>0?8:0);
    h += `<div class="br"><span class="bl">${b.l}</span><div class="bt"><div class="bf g" style="width:${w}%">${b.c}</div></div></div>`;
  });
  h += `</div></div></div>`;

  // Vehicle mix
  const vKeys = Object.keys(veh).sort((a,b)=>veh[b].d-veh[a].d);
  if(vKeys.length>0) {
    h += `<div class="sect"><h2>Vehicle Mix</h2><table><thead><tr><th>Vehicle</th><th class="n">Couriers</th><th class="n">Deliveries</th><th class="n">OH</th><th class="n">DPH</th><th class="n">EPD</th></tr></thead><tbody>`;
    vKeys.forEach(v => {
      const d=veh[v]; h+=`<tr><td>${v}</td><td class="n">${d.c}</td><td class="n">${d.d.toLocaleString()}</td><td class="n">${Math.round(d.oh)}h</td><td class="n">${d.oh>0?(d.d/d.oh).toFixed(2):'-'}</td><td class="n">${d.d>0?'€'+(d.e/d.d).toFixed(2):'-'}</td></tr>`;

  sorted.forEach(c => {
    const tc = c.tar==null?'dm':c.tar>=80?'gd':c.tar>=60?'':'bd';
    const uc = c.ut==null?'dm':c.ut>=60?'gd':c.ut>=45?'':'bd';
    h += `<tr><td>${c.n}</td><td class="dm">${c.v}</td><td class="n">${(c.del||0).toLocaleString()}</td>`;
    h += `<td class="n ${tc}">${c.tar!=null?c.tar+'%':'-'}</td>`;
    h += `<td class="n">${c.tcr!=null?c.tcr+'%':'-'}</td>`;
    h += `<td class="n">${c.dph!=null?c.dph.toFixed(2):'-'}</td>`;
    h += `<td class="n">${c.oh!=null?c.oh+'h':'-'}</td>`;
    h += `<td class="n">${c.ot!=null?c.ot+'h':'-'}</td>`;
    h += `<td class="n ${uc}">${c.ut!=null?c.ut+'%':'-'}</td>`;
    h += `<td class="n">${c.e!=null?'€'+c.e.toFixed(2):'-'}</td>`;
    h += `<td class="n">${c.eph!=null?'€'+c.eph.toFixed(2):'-'}</td>`;
    h += `<td class="n">${c.cpo!=null?'€'+c.cpo.toFixed(2):'-'}</td>`;
    h += `<td class="n dm">${c.tip!=null?'€'+c.tip.toFixed(2):'-'}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  h += `</div>`;
  return h;
}

function renderWhatsApp() {
  let h = `<div class="pane" id="pane-whatsapp">`;
  h += `<div class="sect"><h2>WhatsApp Ground Intel — Courier Earnings</h2>`;
  h += `<div class="subt">From "Bolt & Wolt Malta {Road Update Only}" + "Wolt courier petition ✊" · Last refresh: May 11, 2026</div>`;
  h += `<div class="co">This data comes directly from couriers sharing screenshots and complaints. It shows <b>what couriers are actually offered per delivery</b> — complementing the fleet CSV data which shows aggregate earnings.</div>`;
  h += `</div>`;

  // Screenshot orders
  const std = WA_ORDERS.filter(o=>!o.addon);
  const addons = WA_ORDERS.filter(o=>o.addon);
  const boltStd = std.filter(o=>o.platform==='Bolt');
  const woltStd = std.filter(o=>o.platform==='Wolt');

  h += `<div class="sect"><h2>Order-Level Data (Screenshots, May 5–8)</h2>`;
  h += `<div class="subt">${std.length} standard orders + ${addons.length} add-ons from courier screenshots</div>`;

  // Platform comparison stats
  const median = arr => { const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const bE = boltStd.map(o=>o.earnings), wE = woltStd.map(o=>o.earnings);
  const bK = boltStd.map(o=>o.ePerKm), wK = woltStd.map(o=>o.ePerKm);
  const bD = boltStd.map(o=>o.distKm), wD = woltStd.map(o=>o.distKm);

  h += `<div class="sg">
    <div class="sc"><div class="lb">Bolt median €/order</div><div class="vl">€${median(bE).toFixed(2)}</div><div class="sub">n=${boltStd.length}</div></div>
    <div class="sc"><div class="lb">Wolt median €/order</div><div class="vl">€${median(wE).toFixed(2)}</div><div class="sub">n=${woltStd.length}</div></div>
    <div class="sc"><div class="lb">Bolt median €/km</div><div class="vl">€${median(bK).toFixed(2)}</div></div>
    <div class="sc"><div class="lb">Wolt median €/km</div><div class="vl">€${median(wK).toFixed(2)}</div></div>
    <div class="sc"><div class="lb">Bolt median dist</div><div class="vl">${median(bD).toFixed(1)}km</div></div>
    <div class="sc"><div class="lb">Wolt median dist</div><div class="vl">${median(wD).toFixed(1)}km</div></div>
  </div>`;

  h += `<table><thead><tr><th>Date</th><th>Platform</th><th class="n">€</th><th class="n">km</th><th class="n">€/km</th><th class="n">Est min</th><th>Restaurant</th></tr></thead><tbody>`;
  std.forEach(o => {
    const cls = o.ePerKm < 0.45 ? 'bd' : o.ePerKm >= 0.70 ? 'gd' : '';
    h += `<tr><td class="dm">${o.date}</td><td><span class="pill ${o.platform.toLowerCase()}">${o.platform}</span></td><td class="n">€${o.earnings.toFixed(2)}</td><td class="n">${o.distKm}km</td><td class="n ${cls}">€${o.ePerKm.toFixed(2)}</td><td class="n">${o.estMin}m</td><td class="dm">${o.restaurant}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // Reported rates timeline
  h += `<div class="sect"><h2>Reported Rates Timeline (Feb–May 2026)</h2>`;
  h += `<div class="subt">Text messages where couriers explicitly mention pay rates and distances</div>`;
  h += `<table><thead><tr><th>Date</th><th>Rate</th><th>Distance</th><th class="n">€/km</th><th>Source</th><th>Context</th></tr></thead><tbody>`;
  WA_RATES.forEach(r => {
    h += `<tr><td>${r.date}</td><td>${r.rate}</td><td>${r.dist}</td><td class="n">${r.ePerKm}</td><td class="dm">${r.src}</td><td class="dm">${r.ctx}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // Bonuses
  h += `<div class="sect"><h2>Bonus / Incentive Tracking</h2>`;
  h += `<table><thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Window</th></tr></thead><tbody>`;
  WA_BONUSES.forEach(b => {
    h += `<tr><td>${b.date}</td><td><span class="pill ${b.platform.toLowerCase()}">${b.platform}</span></td><td>${b.type}</td><td>${b.window}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // Fleet costs
  h += `<div class="sect"><h2>Fleet Costs (Courier-Reported)</h2>`;
  h += `<div class="subt">Deducted from gross earnings before courier net pay</div>`;
  h += `<table><thead><tr><th>Item</th><th>Amount</th><th>Notes</th></tr></thead><tbody>`;
  WA_FLEET_COSTS.forEach(c => {
    h += `<tr><td>${c.item}</td><td>${c.amount}</td><td class="dm">${c.notes}</td></tr>`;
  });
  h += `</tbody></table></div>`;

  // Sentiment
  h += `<div class="sect"><h2>Courier Sentiment Themes</h2>`;
  h += `<div class="subt">Recurring themes from ~9,000 messages across both groups</div>`;
  h += `<div class="ic">`;
  WA_SENTIMENT.forEach(s => {
    h += `<div class="icd"><h3>${s.theme}</h3><p>${s.detail}</p></div>`;
  });
  h += `</div></div>`;

  h += `</div>`;
  return h;
}

function renderUpload() {
  return `<div class="pane" id="pane-upload">
    <div class="upload-zone">
      <h3>Add New Fleet Data</h3>
      <p>This tab lets you preview a new fleet before it gets baked into the dashboard. For permanent updates, re-run the dashboard generator with the new CSVs.</p>
      <div class="ur">
        <div class="uf"><label>Fleet name</label><input type="text" id="uf_name" placeholder="e.g. NewFleet Jun 1"></div>
        <div class="uf"><label>Performance CSV</label><input type="file" id="uf_perf" accept=".csv"></div>
        <div class="uf"><label>Financials CSV</label><input type="file" id="uf_fin" accept=".csv"></div>
        <button class="btn" onclick="previewFleet()">Preview</button>
      </div>
    </div>
    <div id="uf_preview"></div>
  </div>`;
}

init();
</script>
</body>
</html>
